# Excavator imported-mesh calibration
#
# Columns:
# part  x  y  z  roll_degrees  pitch_degrees  yaw_degrees  uniform_scale
#
# x is forward, y is left/right, and z is up.  The translation and rotation
# are relative to that part's Chrono body/joint frame.  Keep scale uniform so
# round pin holes stay round.  This file is read every time the program starts,
# so changing it does not require recompiling.
#
# The boom, arm, and bucket defaults use one common MathScavator9000 scale and
# orientation.  Their origins are the hinge locations from the upstream URDF.
base    0.700000  0.000000  0.300000  0.0  0.0  -90.0  0.500000000
boom    0.000000  0.000000  0.000000  0.0  0.0  -90.0  0.448717949
arm     0.000000  0.000000  0.000000  0.0  0.0  -90.0  0.448717949
bucket  0.000000  0.000000  0.000000  0.0  0.0  -90.0  0.448717949
